<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="icon" href="/favicon.jpg" type="image/jpeg">
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="site-nav.css" />
    <script src="i18n.js" defer></script>
    <script src="contact-snake.js" defer></script>
    <style>
      @font-face {
        font-family: 'Neue Machina';
        src: url('fonts/PPNeueMachina-PlainRegular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Neue Machina';
        src: url('fonts/PPNeueMachina-PlainLight.ttf') format('truetype');
        font-weight: 300;
      }
      @font-face {
        font-family: 'Neue Machina';
        src: url('fonts/PPNeueMachina-PlainUltrabold.ttf') format('truetype');
        font-weight: 700;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #000000;
        --fg: #ffffff;
        --fg-dim: rgba(255, 255, 255, 0.75);
        --green: #49dca4;
        --pad: 60px;
        --pad-sm: 32px;
        --nav-h: 56px;
      }

      html {
        scroll-behavior: smooth;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Neue Machina', sans-serif;
        font-weight: 300;
        overflow: hidden;
      }

      .top-nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--nav-h);
        padding: 0 var(--pad);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .nav-brand {
        text-decoration: none;
        display: flex;
        align-items: baseline;
        gap: 8px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .nav-brand-spolia {
        font-family: 'EB Garamond', serif;
        font-style: italic;
        font-size: 32px;
        font-weight: 400;
        letter-spacing: 0.5px;
        color: var(--green);
      }
      .nav-brand-botanique {
        font-family: 'JetBrains Mono', monospace;
        font-size: 27px;
        font-weight: 500;
        letter-spacing: 1px;
        color: var(--green);
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: var(--nav-link-gap);
      }
      .nav-link {
        text-decoration: none;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--nav-link-font-size);
        letter-spacing: var(--nav-link-letter-spacing);
        text-transform: uppercase;
        color: var(--green);
        transition: color 0.2s, border-color 0.2s;
        padding-top: var(--nav-link-padding-top);
        padding-bottom: var(--nav-link-padding-bottom);
        border-bottom: 1px solid transparent;
      }
      .nav-link:hover {
        color: white;
      }
      .nav-link.active {
        color: white;
        border-bottom: 1px solid white;
      }
      .nav-controls {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-left: 24px;
      }
      .nav-ctrl-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.5);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.25s ease;
        padding: 0;
      }
      .nav-ctrl-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .nav-ctrl-btn:hover {
        border-color: rgba(255, 255, 255, 0.5);
        color: white;
      }
      .nav-ctrl-btn.on {
        border-color: var(--green);
        color: var(--green);
      }
      .nav-lang-btn {
        width: 48px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .page {
        position: relative;
        min-height: 100vh;
        width: 100%;
        overflow: hidden;
        background: #000;
      }
      .contact-bg-video {
        display: none;
      }
      .snake-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        z-index: 1;
      }
      .snake-bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 58px;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: #000;
        border-top: 1px solid rgba(73, 220, 164, 0.2);
        pointer-events: none;
      }
      .snake-score {
        color: var(--green);
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
      }
      .snake-legend {
        color: var(--green);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        letter-spacing: 1px;
      }
      .snake-legend .legend-emoji {
        font-size: 24px;
        line-height: 1;
        vertical-align: -5px;
      }
      .snake-game-over {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
      }
      .snake-game-over.visible {
        display: flex;
      }
      .snake-game-over-panel {
        width: min(520px, calc(100vw - 48px));
        padding: 34px 38px 36px;
        border: 1px solid rgba(73, 220, 164, 0.72);
        background: rgba(0, 0, 0, 0.92);
        box-shadow: 0 0 46px rgba(73, 220, 164, 0.14);
        text-align: center;
      }
      .snake-game-over-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: clamp(42px, 6vw, 76px);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: 1px;
        color: white;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .snake-name-input {
        width: 100%;
        margin-bottom: 20px;
        padding: 13px 14px;
        border: 1px solid rgba(73, 220, 164, 0.62);
        background: transparent;
        color: white;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        text-align: center;
        outline: none;
      }
      .snake-name-input:focus {
        border-color: var(--green);
      }
      .snake-score-list {
        list-style: none;
        margin: 0 0 24px;
        padding: 0;
        color: var(--green);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        line-height: 1.8;
        text-align: left;
      }
      .snake-play-again {
        appearance: none;
        border: 1px solid var(--green);
        background: transparent;
        color: var(--green);
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        letter-spacing: 1.6px;
        padding: 12px 22px;
        text-transform: uppercase;
      }
      .snake-play-again:hover {
        background: var(--green);
        color: #000;
      }
      .contact-content {
        position: relative;
        z-index: 3;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--nav-h) + 60px) var(--pad) 60px;
        transform: translateY(-50px);
      }
      .contact-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .contact-card {
        max-width: 760px;
        text-align: center;
        padding: 38px 48px 42px;
        border: 1px solid rgba(73, 220, 164, 0.58);
        background: rgba(0, 0, 0, 0.82);
        box-shadow: 0 0 0 1px rgba(73, 220, 164, 0.12), 0 0 36px rgba(73, 220, 164, 0.08);
      }
      .contact-title {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: clamp(28px, 4vw, 54px);
        line-height: 1.05;
        letter-spacing: -0.8px;
        color: var(--fg);
        margin-bottom: 24px;
      }
      .contact-text {
        font-size: clamp(20px, 2vw, 28px);
        line-height: 1.7;
        color: var(--fg-dim);
      }
      .contact-text a {
        color: var(--green);
        text-decoration: none;
      }
      .contact-text a:hover {
        color: white;
      }
      .contact-controls-hint {
        margin-top: 28px;
        min-height: 74px;
        color: var(--green);
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        line-height: 1.65;
        letter-spacing: 0.8px;
        text-align: center;
      }
      .contact-controls-hint.hidden {
        visibility: hidden;
      }
      .contact-controls-title {
        display: block;
        margin-bottom: 6px;
        font-size: 18px;
        letter-spacing: 1.2px;
      }

      @media (max-width: 1100px) {
        .top-nav {
          padding: 0 var(--pad-sm);
        }
      }

      @media (max-width: 767px) {
        html,
        body {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          min-height: 100%;
          overflow: hidden;
          overscroll-behavior: none;
        }
        body.spa-mode #spa-content {
          height: 100svh !important;
          padding-top: 0 !important;
          overflow: hidden !important;
        }
        .page {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100svh;
          min-height: 0;
          overflow: hidden;
        }
        .snake-canvas,
        .snake-bottom-bar,
        .snake-game-over,
        .contact-controls-hint {
          display: none !important;
        }
        .contact-card {
          border: none;
          background: transparent;
          box-shadow: none;
          padding: 0;
          max-width: calc(100vw - 40px);
        }
        .contact-bg-video {
          display: block !important;
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100svh;
          object-fit: cover;
          z-index: 0;
        }
        .contact-content {
          position: fixed;
          inset: 0;
          min-height: 0;
          height: 100svh;
          padding: 0 20px;
          background: transparent;
          transform: translateY(-56px);
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <nav class="top-nav">
      <a class="nav-brand" href="index.html?skipIntro=1">
        <span class="nav-brand-spolia">Spolia</span>
        <span class="nav-brand-botanique">botanique</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="about.html" data-i18n="nav.about">About</a>
        <a class="nav-link" href="ultraviolet-city.html" data-i18n="nav.ultraviolet-city">The Ultraviolet City</a>
        <a class="nav-link" href="immersive-sketching.html" data-i18n="nav.immersive-sketching">Immersive Sketching</a>
        <a class="nav-link" href="holo-botanics.html" data-i18n="nav.holo-botanics">Holo Botanics</a>
        <a class="nav-link" href="ar-apps.html" data-i18n="nav.ar-apps">AR Apps</a>
        <a class="nav-link active" href="contact.html" data-i18n="nav.contact">Contact</a>
      </div>
      <div class="nav-controls">
        <button class="nav-ctrl-btn nav-lang-btn" id="gc-lang" title="Switch to French" aria-label="Switch to French">EN</button>
        <button class="nav-ctrl-btn" id="gc-snd" title="Sound">
          <svg viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
          </svg>
        </button>
        <button class="nav-ctrl-btn" id="gc-fs" title="Fullscreen">
          <svg viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
          </svg>
        </button>
      </div>
    </nav>

    <section class="page" id="page-contact">
      <video autoplay muted loop playsinline preload="auto" webkit-playsinline class="contact-bg-video">
        <source src="videos/bee05.mp4" type="video/mp4" />
      </video>
      <canvas class="snake-canvas" aria-hidden="true"></canvas>
      <div class="contact-content">
        <div class="contact-stack">
          <div class="contact-card" data-snake-obstacle>
            <div class="contact-title" data-i18n="page-contact.contact-title-1">Contact</div>
            <div class="contact-text" data-i18n="page-contact.contact-text-1">
              For further inquiries, please write to
              <a href="mailto:metekutlu@gmail.com">metekutlu@gmail.com</a>.
            </div>
          </div>
          <div class="contact-controls-hint">
            <span class="contact-controls-title">Play Vine Snake</span>
            Press space to begin or pause.<br />
            Use arrow keys to move.
          </div>
        </div>
      </div>
      <div class="snake-bottom-bar" data-snake-bottom-bar>
        <div class="snake-legend">
          <span class="legend-emoji">💧</span>→<span class="legend-emoji">🌿</span>
          &nbsp; · &nbsp;<span class="legend-emoji">💨</span>→<span class="legend-emoji">🌸</span>
          &nbsp; · &nbsp;<span class="legend-emoji">☢</span>→<span class="legend-emoji">🥀</span>
          &nbsp; · &nbsp;<span class="legend-emoji">🔥</span> decay
        </div>
        <div class="snake-score" data-snake-score>GROWTH: 0</div>
      </div>
      <div class="snake-game-over" data-snake-game-over>
        <div class="snake-game-over-panel">
          <div class="snake-game-over-title">Game Over</div>
          <input class="snake-name-input" data-snake-name maxlength="18" autocomplete="off" placeholder="NAME" />
          <ol class="snake-score-list" data-snake-scores></ol>
          <button class="snake-play-again" data-snake-play-again type="button">Play Again</button>
        </div>
      </div>
    </section>

    <audio id="global-audio" loop>
      <source src="sounds/merry.mp3" type="audio/mpeg" />
    </audio>

    <script>
      (() => {
        const audio = document.getElementById('global-audio');
        const langBtn = document.getElementById('gc-lang');
        const sndBtn = document.getElementById('gc-snd');
        const fsBtn = document.getElementById('gc-fs');

        function setSnd(on) {
          sndBtn.classList.toggle('on', on);
          localStorage.setItem('soundEnabled', on ? '1' : '0');
          if (on) {
            audio.play().catch(() => {});
          } else {
            audio.pause();
          }
        }

        if (['1', 'true'].includes(localStorage.getItem('soundEnabled'))) {
          setSnd(true);
        }

        if (['1', 'true'].includes(localStorage.getItem('fullscreenPreferred'))) {
          fsBtn.classList.add('on');
        }

        async function setFs(on) {
          localStorage.setItem('fullscreenPreferred', on ? '1' : '0');
          try {
            if (on) {
              await document.documentElement.requestFullscreen();
            } else if (document.fullscreenElement) {
              await document.exitFullscreen();
            }
          } catch {}
        }

        sndBtn.addEventListener('click', () =>
          setSnd(!['1', 'true'].includes(localStorage.getItem('soundEnabled')))
        );
        langBtn.addEventListener('click', async () => {
          const nextLang = localStorage.getItem('language') === 'fr' ? 'en' : 'fr';
          if (window.SpoliaI18n) {
            window.SpoliaI18n.setLanguage(nextLang);
            await window.SpoliaI18n.applyTranslations(document, 'contact');
          } else {
            localStorage.setItem('language', nextLang);
            window.location.reload();
          }
        });
        fsBtn.addEventListener('click', () => setFs(!document.fullscreenElement));
        document.addEventListener('fullscreenchange', () =>
          fsBtn.classList.toggle('on', !!document.fullscreenElement)
        );
      })();
    </script>
  </body>
</html>
